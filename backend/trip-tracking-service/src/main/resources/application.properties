server.port=${TRIP_PORT:8083}
spring.application.name=trip-tracking-service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/campusvolt_tracking_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:campusvolt-dev-secret-change-me-at-least-32-bytes}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.fleet-url=${FLEET_SERVICE_URL:http://localhost:8082}
