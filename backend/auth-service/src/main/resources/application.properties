server.port=${AUTH_PORT:8081}
spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/campusvolt_auth_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:campusvolt-dev-secret-change-me-at-least-32-bytes}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@campusvolt.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
